name: APK Android

# Construit un APK installable à chaque envoi sur la branche de développement,
# ou à la demande depuis l'onglet Actions (bouton « Run workflow »).
on:
  push:
    branches: [claude/plugin-marketplace-routines-ghud7x, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: npm ci

      - name: Vérifications (types, lint, tests)
        run: |
          npx tsc --noEmit
          npx expo lint
          npx jest --ci

      - name: Projet natif Android
        run: npx expo prebuild --platform android --no-install
        env:
          # Facultatif : renseigner ces secrets dans le dépôt pour brancher Supabase.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mijote-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
